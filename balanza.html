<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balanza</title><style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#22201c;--mute:#756f64;--line:#d9d2c3;--accent:#22201c}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--panel:#201e1b;--ink:#efebe2;--mute:#9a9486;--line:#38342d;--accent:#efebe2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:18px 16px 40px}
h1{font-size:1.7rem;margin:6px 0 2px}
.back{color:var(--mute);font-size:.9rem;text-decoration:none}
.stats{color:var(--mute);font-size:.9rem;margin:4px 0;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;justify-content:center}
button{font:inherit;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.side{display:flex;justify-content:space-around;align-items:center;margin:10px 0 0;color:var(--mute);font-size:.9rem}
.coins{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:8px 0}
.coin{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:.95rem;padding:0}
.coin.L{background:#e6efe0;border-color:#7fa074}
.coin.R{background:#f6e3df;border-color:#c07a6e}
.coin.ok{opacity:.35}
@media (prefers-color-scheme:dark){.coin.L{background:#2a3a28}.coin.R{background:#3d2a27}}
.hist{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:48px}
.hist p{margin:4px 0}
.msg{min-height:1.4em;text-align:center;color:var(--ink);margin:8px 0}
</style></head><body><main>
<a class="back" href="index.html">← Juegos de lógica</a>
<h1>Balanza</h1>
<p class="stats" id="st"></p>
<div class="bar" id="lv"></div>
<div class="bar"><button id="tm" aria-pressed="false">Contrarreloj</button><button id="nw">Nuevo</button></div>
<p class="stats">Una moneda pesa más que las demás. Toca una moneda para cambiarla: el número significa que aún no la has usado, <b>I</b> que está a la izquierda y <b>D</b> que está a la derecha. Las monedas atenuadas ya son auténticas.</p>
<div class="side"><span>Izquierda (I)</span><span>Derecha (D)</span></div>
<div class="coins" id="coins"></div>
<div class="bar">
  <button id="pesar">Pesar</button>
  <button id="limpiar">Quitar marcas</button>
  <button id="adiv" aria-pressed="false">Adivinar</button>
</div>
<p class="stats" id="left"></p>
<p class="msg" id="msg"></p>
<div class="hist" id="hist"></div>
<p class="stats" id="t"></p>
</main>
<script>
const KEY="balanza-lg";
const $=id=>document.getElementById(id);
const COINS=[3,9,27], WEIGH=[1,2,3];
let lvl=2,n,h,marks,ok,left_w,hist,done=false,guessMode=false,timed=false,tmr=null,t=0;

function wins(){try{return JSON.parse(localStorage.getItem(KEY)||'{"w":0}').w||0}catch(e){return 0}}
function addWin(){try{localStorage.setItem(KEY,JSON.stringify({w:wins()+1}))}catch(e){}}
function stop(){clearInterval(tmr);tmr=null}
function tick(){$("t").textContent=timed?"⏱ "+t+" s":""}
function start(){stop();if(!timed){tick();return}t=120;tick();tmr=setInterval(()=>{t--;tick();if(t<=0){stop();done=true;$("msg").textContent="Se acabó el tiempo. La moneda pesada era la "+(h+1)+".";render()}},1000)}
function newGame(){
  n=COINS[lvl];left_w=WEIGH[lvl];h=Math.floor(Math.random()*n);
  marks=Array(n).fill(0);ok=Array(n).fill(false);hist=[];done=false;guessMode=false;
  $("msg").textContent="";start();render();
}
function coinClick(i){
  if(done)return;
  if(guessMode){
    if(i===h){done=true;stop();addWin();$("msg").textContent="¡Correcto! La moneda pesada es la "+(h+1)+".";}
    else $("msg").textContent="No es la "+(i+1)+". Sigue probando, adivinar no gasta pesadas.";
    render();return;
  }
  marks[i]=(marks[i]+1)%3;$("msg").textContent="";render();
}
function weigh(){
  if(done)return;
  if(left_w===0)return $("msg").textContent="No te quedan pesadas. Toca «Adivinar» y elige la moneda.";
  const L=marks.filter(m=>m===1).length,R=marks.filter(m=>m===2).length;
  if(L===0||L!==R)return $("msg").textContent="Pon el mismo número de monedas a cada lado para poder pesar.";
  left_w--;
  const num=WEIGH[lvl]-left_w;
  if(marks[h]===1){
    hist.push("Pesada "+num+": la izquierda pesa más ("+L+" contra "+R+")");
    $("msg").textContent="La balanza baja por la izquierda: la moneda pesada está entre las de la izquierda.";
  } else if(marks[h]===2){
    hist.push("Pesada "+num+": la derecha pesa más ("+L+" contra "+R+")");
    $("msg").textContent="La balanza baja por la derecha: la moneda pesada está entre las de la derecha.";
  } else {
    hist.push("Pesada "+num+": pesan lo mismo ("+L+" contra "+R+")");
    $("msg").textContent="Pesan lo mismo: la moneda pesada no está en la balanza.";
  }
  const mine=marks[h]===1?1:marks[h]===2?2:0;
  marks.forEach((m,i)=>{if(mine===0?m!==0:m!==mine)ok[i]=true});
  marks=Array(n).fill(0);
  render();
}
function render(){
  $("st").textContent="Ganadas: "+wins();
  $("lv").innerHTML="";
  ["Fácil","Medio","Difícil"].forEach((tx,k)=>{const b=document.createElement("button");b.textContent=tx;b.setAttribute("aria-pressed",String(lvl===k));b.onclick=()=>{lvl=k;newGame()};$("lv").appendChild(b)});
  $("tm").setAttribute("aria-pressed",String(timed));
  $("adiv").setAttribute("aria-pressed",String(guessMode));
  $("adiv").disabled=done;
  $("pesar").disabled=done||left_w===0;
  $("limpiar").disabled=done;
  $("left").textContent="Pesadas restantes: "+left_w+" de "+WEIGH[lvl]+" · Monedas: "+n+(guessMode?" · Modo adivinar: toca la moneda pesada":"");
  const box=$("coins");box.innerHTML="";
  marks.forEach((m,i)=>{const b=document.createElement("button");b.className="coin"+(m===1?" L":m===2?" R":"")+(ok[i]?" ok":"");b.textContent=m===1?"I":m===2?"D":i+1;b.setAttribute("aria-label","Moneda "+(i+1)+(m===1?", a la izquierda":m===2?", a la derecha":", sin usar"));b.disabled=done&&i!==h;b.onclick=()=>coinClick(i);box.appendChild(b)});
  $("hist").innerHTML=hist.length?hist.map(x=>"<p>"+x+"</p>").join(""):"<p style='color:var(--mute)'>Aún no has pesado nada.</p>";
}
$("pesar").onclick=weigh;
$("limpiar").onclick=()=>{if(!done){marks=Array(n).fill(0);$("msg").textContent="";render()}};
$("adiv").onclick=()=>{if(!done){guessMode=!guessMode;$("msg").textContent=guessMode?"Pulsa la moneda que crees pesada.":"";render()}};
$("nw").onclick=newGame;
$("tm").onclick=()=>{timed=!timed;newGame()};
newGame();
</script>
</body></html>
