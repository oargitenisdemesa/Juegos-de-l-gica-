<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caballeros y mentirosos</title><style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#22201c;--mute:#756f64;--line:#d9d2c3;--accent:#22201c}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--panel:#201e1b;--ink:#efebe2;--mute:#9a9486;--line:#38342d;--accent:#efebe2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:18px 16px 40px}
h1{font-size:1.7rem;margin:6px 0 2px}
.back{color:var(--mute);font-size:.9rem;text-decoration:none}
.stats{color:var(--mute);font-size:.9rem;margin:4px 0;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;justify-content:center}
button{font:inherit;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h2{font-size:1.05rem;margin:0 0 4px}
.card p{margin:0 0 8px}
.card .bar{margin:6px 0 0;justify-content:flex-start}
.tag{font-size:.8rem;color:var(--mute);font-weight:normal}
.msg{min-height:1.4em;text-align:center;color:var(--mute);margin:8px 0}
</style></head><body><main>
<a class="back" href="index.html">← Juegos de lógica</a>
<h1>Caballeros y mentirosos</h1>
<p class="stats" id="st"></p>
<div class="bar" id="lv"></div>
<div class="bar"><button id="tm" aria-pressed="false">Contrarreloj</button><button id="nw">Nuevo</button></div>
<div id="people"></div>
<div class="bar"><button id="ck">Comprobar</button></div>
<p class="msg" id="msg"></p>
<p class="stats" id="t"></p>
<p class="stats">Los caballeros siempre dicen la verdad; los mentirosos, siempre mienten. Ana ya viene marcada como dato del enigma: a partir de ahí, deduce el resto.</p>
</main>
<script>
const KEY="caballeros-lg";
const NAMES=["Ana","Beto","Carla","Dani"];
const $=id=>document.getElementById(id);
let lvl=2,N=2,st=[],anchor=null,guess=[],done=false,timed=false,tmr=null,left=0;

// Cada persona afirma algo sobre otra. Una afirmación es verdadera si el hablante
// es caballero y falsa si es mentiroso. Para romper la simetría (invertir a todos
// daría otra solución válida) se fija el tipo de Ana como dato del enigma.
function valid(types,list){return list.every(x=>types[x.s]===(types[x.t]===x.claim))}
function countSols(n,list,a){let c=0;for(let m=0;m<(1<<n);m++){const ty=Array.from({length:n},(_,i)=>!!(m>>i&1));if(ty[a.s]===a.v&&valid(ty,list))c++}return c}
function gen(n){
  for(let k=0;k<20000;k++){
    const truth=Array.from({length:n},()=>Math.random()<.5);
    const list=[];
    for(let s=0;s<n;s++){
      let t;do{t=Math.floor(Math.random()*n)}while(t===s);
      list.push({s,t,claim:truth[s]?truth[t]:!truth[t]});
    }
    const a={s:0,v:truth[0]};
    if(countSols(n,list,a)===1)return {list,anchor:a};
  }
  return null;
}
function wins(){try{return JSON.parse(localStorage.getItem(KEY)||'{"w":0}').w||0}catch(e){return 0}}
function addWin(){try{localStorage.setItem(KEY,JSON.stringify({w:wins()+1}))}catch(e){}}
function stop(){clearInterval(tmr);tmr=null}
function tick(){$("t").textContent=timed?"⏱ "+left+" s":""}
function start(){stop();if(!timed){tick();return}left=120;tick();tmr=setInterval(()=>{left--;tick();if(left<=0){stop();done=true;$("msg").textContent="Se acabó el tiempo. Pulsa Nuevo.";render()}},1000)}
function newGame(){
  N=lvl;
  let g=null;while(!g)g=gen(N);
  st=g.list;anchor=g.anchor;
  guess=Array(N).fill(null);guess[anchor.s]=anchor.v;
  done=false;$("msg").textContent="";start();render();
}
function setG(i,v){if(done||i===anchor.s)return;guess[i]=guess[i]===v?null:v;render()}
function check(){
  if(done)return;
  if(guess.includes(null))return $("msg").textContent="Marca a todas las personas antes de comprobar.";
  if(valid(guess,st)&&guess[anchor.s]===anchor.v){done=true;stop();addWin();$("msg").textContent="¡Correcto! Has resuelto el enigma.";render()}
  else $("msg").textContent="Alguna afirmación no encaja con tus respuestas. Revisa.";
}
function render(){
  $("st").textContent="Ganadas: "+wins();
  $("lv").innerHTML="";
  [["Fácil",2],["Medio",3],["Difícil",4]].forEach(([t,n])=>{const b=document.createElement("button");b.textContent=t;b.setAttribute("aria-pressed",String(lvl===n));b.onclick=()=>{lvl=n;newGame()};$("lv").appendChild(b)});
  $("tm").setAttribute("aria-pressed",String(timed));
  const box=$("people");box.innerHTML="";
  st.forEach(x=>{
    const d=document.createElement("div");d.className="card";
    const dato=x.s===anchor.s?' <span class="tag">· dato del enigma</span>':"";
    d.innerHTML=`<h2>${NAMES[x.s]}${dato}</h2><p>Dice: «${NAMES[x.t]} es ${x.claim?"caballero":"mentiroso"}».</p>`;
    const bar=document.createElement("div");bar.className="bar";
    [["Caballero",true],["Mentiroso",false]].forEach(([t,v])=>{const b=document.createElement("button");b.textContent=t;b.setAttribute("aria-pressed",String(guess[x.s]===v));b.disabled=done||x.s===anchor.s;b.onclick=()=>setG(x.s,v);bar.appendChild(b)});
    d.appendChild(bar);box.appendChild(d);
  });
  $("ck").disabled=done;
}
$("ck").onclick=check;
$("nw").onclick=newGame;
$("tm").onclick=()=>{timed=!timed;newGame()};
newGame();
</script>
</body></html>
