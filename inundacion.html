<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inundación</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#22201c;--mute:#756f64;--line:#d9d2c3;--accent:#22201c;--ok:#2e7d4f;--ko:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--panel:#201e1b;--ink:#efebe2;--mute:#9a9486;--line:#38342d;--accent:#efebe2;--ok:#6fcf97;--ko:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:560px;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.95rem}
.top a{color:inherit}
.top b{color:var(--ink)}
h1{font-size:1.7rem;margin:10px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);font:inherit;padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--bg)}
label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:var(--mute)}
#clock{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:bold}
.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed=true]{background:var(--accent);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
#msg{min-height:1.6em;margin-top:14px;font-weight:bold;text-align:center}
#msg.ok{color:var(--ok)}
#msg.ko{color:var(--ko)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
<style>
#board{display:grid;gap:2px;margin:0 auto 14px;width:min(100%,420px);aspect-ratio:1}
.k{display:flex;align-items:center;justify-content:center;border-radius:4px;color:rgba(0,0,0,.4);font-size:clamp(.5rem,2.6vw,.9rem);transition:background .15s}
#pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#pal button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);color:rgba(0,0,0,.45);font-size:1.2rem;cursor:pointer;padding:0}
#pal button:disabled{opacity:.3;cursor:default}
@media (prefers-reduced-motion:reduce){.k{transition:none}}
</style>
</head>
<body>
<main>
<div class="top"><a href="index.html">← Juegos</a><span>Ganadas: <b id="wins">0</b></span></div>
<h1>Inundación</h1>
<p class="sub">Empieza en la esquina de arriba a la izquierda. Cambia su color para absorber vecinas hasta que todo el tablero sea de un solo color.</p>
<div class="ctl">
  <div class="seg" id="lv"><button aria-pressed="true">Fácil</button><button aria-pressed="false">Medio</button><button aria-pressed="false">Difícil</button></div>
  <label><input type="checkbox" id="ct"> Contrarreloj</label>
</div>
<div class="bar"><span id="info"></span><span id="clock">0:00</span><button class="btn" id="nueva">Nueva partida</button></div>
<div id="board"></div>
<div id="pal"></div>
<div id="msg" role="status"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
/* Marco común: niveles, contrarreloj, reloj y contador de partidas ganadas.
   cfg = { key, limites:[seg fácil, medio, difícil], nuevo(nivel, marco), alFin(ganado) } */
function Marco(cfg){
  const M={nivel:0,fin:false,t0:0,tick:0,limite:0};
  const clock=$("#clock"),msg=$("#msg"),ct=$("#ct"),botones=[...document.querySelectorAll("#lv button")];
  const leer=()=>{try{return JSON.parse(localStorage.getItem(cfg.key)||"null")||{w:0}}catch(e){return{w:0}}};
  const verGanadas=()=>{$("#wins").textContent=leer().w||0};
  M.seg=()=>M.t0?Math.floor((Date.now()-M.t0)/1000):0;
  M.dibujar=()=>{
    const e=M.seg();
    if(ct.checked){
      const r=Math.max(M.limite-e,0);
      clock.textContent="⏱ "+fmt(r);
      if(r===0&&M.t0&&!M.fin)M.perder("⏰ Se acabó el tiempo.");
    }else clock.textContent=fmt(e);
  };
  M.iniciarReloj=()=>{if(M.t0||M.fin)return;M.t0=Date.now();M.tick=setInterval(M.dibujar,250)};
  const cerrar=(ok,txt)=>{
    M.fin=true;clearInterval(M.tick);M.dibujar();
    msg.className=ok?"ok":"ko";msg.textContent=txt;
    if(cfg.alFin)cfg.alFin(ok);
  };
  M.ganar=t=>{
    if(M.fin)return;
    const s=leer();s.w=(s.w||0)+1;
    try{localStorage.setItem(cfg.key,JSON.stringify(s))}catch(e){}
    verGanadas();cerrar(true,"🎉 "+t);
  };
  M.perder=t=>{if(!M.fin)cerrar(false,t)};
  M.nueva=()=>{
    clearInterval(M.tick);M.t0=0;M.fin=false;M.limite=cfg.limites[M.nivel];
    msg.textContent="";msg.className="";M.dibujar();
    cfg.nuevo(M.nivel,M);
  };
  botones.forEach((b,i)=>b.onclick=()=>{
    M.nivel=i;botones.forEach((x,j)=>x.setAttribute("aria-pressed",i===j));M.nueva();
  });
  ct.onchange=M.nueva;
  $("#nueva").onclick=M.nueva;
  verGanadas();M.nueva();
  return M;
}
</script>
<script>
const D=[[8,4,6],[10,5,3],[12,6,1]];
const COL=["#e4572e","#f3a712","#29a39a","#3d7dca","#8e5bd1","#e0457b"];
const SIM=["●","▲","■","◆","★","✚"];
let n,K,g,mov,max;
const board=$("#board"),pal=$("#pal");

function region(h){
  const v=new Uint8Array(n*n),pila=[0],o=[],c=h[0];
  v[0]=1;
  while(pila.length){
    const i=pila.pop();o.push(i);
    const r=i/n|0,x=i%n;
    [r>0?i-n:-1,r<n-1?i+n:-1,x>0?i-1:-1,x<n-1?i+1:-1].forEach(j=>{
      if(j>=0&&!v[j]&&h[j]===c){v[j]=1;pila.push(j)}
    });
  }
  return o;
}
function aplicar(h,c){
  if(h[0]===c)return;
  region(h).forEach(i=>h[i]=c);
}
const uno=h=>h.every(v=>v===h[0]);

function voraz(g0){
  const h=g0.slice();let m=0;
  while(!uno(h)){
    let mejor=-1,bs=-1;
    for(let c=0;c<K;c++){
      if(c===h[0])continue;
      const t=h.slice();aplicar(t,c);
      const s=region(t).length;
      if(s>bs){bs=s;mejor=c}
    }
    aplicar(h,mejor);m++;
  }
  return m;
}

function pintar(m=M){
  board.style.gridTemplateColumns="repeat("+n+",1fr)";
  board.innerHTML=g.map(c=>'<div class="k" style="background:'+COL[c]+'">'+SIM[c]+"</div>").join("");
  [...pal.children].forEach((b,c)=>b.disabled=m.fin||c===g[0]);
  $("#info").textContent="Movimientos: "+mov+" / "+max;
}

function montarPaleta(){
  pal.innerHTML="";
  for(let c=0;c<K;c++){
    const b=document.createElement("button");
    b.style.background=COL[c];b.textContent=SIM[c];b.setAttribute("aria-label","Color "+(c+1));
    b.onclick=()=>jugar(c);
    pal.appendChild(b);
  }
}

const M=Marco({
  key:"inundacion-lg",
  limites:[120,240,420],
  nuevo(l,m){
    let holgura;
    [n,K,holgura]=D[l];
    do{g=Array.from({length:n*n},()=>rnd(0,K-1))}while(uno(g));
    max=voraz(g)+holgura;mov=0;
    montarPaleta();pintar(m);
  },
  alFin(){pintar()}
});

function jugar(c){
  if(M.fin||c===g[0])return;
  M.iniciarReloj();
  aplicar(g,c);mov++;
  pintar();
  if(uno(g))M.ganar("¡Tablero inundado en "+mov+" movimientos!");
  else if(mov>=max)M.perder("Te quedaste sin movimientos. Prueba otra vez.");
}
</script>
</body>
</html>
