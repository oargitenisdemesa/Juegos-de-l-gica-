<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Letras Zen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f1ea; --fg:#2d332e; --muted:#7d8478; --accent:#5f7d62; --tile:#ffffff; --line:#d9d6cb;
  --font-display:"Fraunces",Georgia,serif; --font-body:"Source Sans 3",system-ui,sans-serif;
  color-scheme:light;
}
:root{--panel:var(--tile);--ink:var(--fg)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f2420; --fg:#e7e5dc; --muted:#9aa294; --accent:#9dbb9f; --tile:#2a302b; --line:#3a4138;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f2420; --fg:#e7e5dc; --muted:#9aa294; --accent:#9dbb9f; --tile:#2a302b; --line:#3a4138;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.4 var(--font-body);min-height:100vh;min-height:100dvh;
  padding:max(20px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:center}
h1{font:600 28px/1.1 var(--font-display);margin:0;text-align:center}
.sub{color:var(--muted);margin:6px 0 0;text-align:center;font-size:15px}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px}
.words{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.box{width:clamp(24px,8vw,34px);height:clamp(30px,9vw,40px);border-radius:8px;background:var(--tile);border:1px solid var(--line);
  display:grid;place-items:center;font:600 clamp(16px,4.5vw,20px) var(--font-display);text-transform:uppercase}
.box.empty{border-style:dashed;color:transparent}
.box.solved{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.current{height:28px;font:600 20px var(--font-display);letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.wheel{position:relative;width:min(300px,84vw);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wheel .ring{position:absolute;inset:9%;border:1px solid var(--line);border-radius:50%}
.letter{position:absolute;width:clamp(44px,14vw,54px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--tile);border:1px solid var(--line);color:var(--fg);font:600 clamp(18px,5.5vw,22px) var(--font-display);
  display:grid;place-items:center;cursor:pointer;text-transform:uppercase;padding:0;touch-action:none}
.letter.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.letter:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.btn{font:600 15px var(--font-body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--fg);cursor:pointer;min-height:40px}
button.btn[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:6px;justify-content:center}
.opts{color:var(--muted);font-size:14px;text-align:center;margin:0}
.msg{min-height:20px;color:var(--muted);font-size:14px;text-align:center}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;padding:24px}
.overlay[hidden]{display:none}
.panel{background:var(--tile);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.panel h2{font:600 24px var(--font-display);margin:0}
.panel p{margin:0;color:var(--muted)}
.panel .actions{margin-top:6px}
@media (prefers-reduced-motion:no-preference){.box.solved{transition:background .4s}}
</style>
</head>
<body>
<main class="card">
  <div>
    <h1>Letras Zen</h1>
    <p class="sub" id="info"></p>
  </div>

  <div class="seg" id="levels" role="group" aria-label="Dificultad">
    <button class="btn" data-l="5">Fácil</button>
    <button class="btn" data-l="6">Medio</button>
    <button class="btn" data-l="7">Difícil</button>
  </div>

  <div class="words" id="words" aria-label="Palabras ocultas"></div>

  <div class="current" id="current" aria-live="polite"></div>

  <div class="wheel" id="wheel" aria-label="Rueda de letras">
    <div class="ring"></div>
  </div>

  <div class="actions">
    <button class="btn" id="zen" aria-pressed="false">Zen</button>
    <button class="btn" id="hint">Pistas (6)</button>
    <button class="btn" id="shuffle">Reordenar</button>
    <button class="btn" id="newround">Nueva ronda</button>
  </div>
  <p class="opts">Arrastra por las letras para formar palabras (también en el móvil). Zen: muestra la primera letra de cada palabra. Pistas: desvela letras al azar.</p>
  <div class="msg" id="msg"></div>
</main>

<div class="overlay" id="win" hidden>
  <div class="panel">
    <h2>¡Enhorabuena!</h2>
    <p id="winText"></p>
    <div class="actions">
      <button class="btn" id="again">Nueva ronda</button>
      <button class="btn" id="close">Cerrar</button>
    </div>
  </div>
</div>

<script>
// Diccionario en mayúsculas y sin acentos. Cada ronda elige una palabra base
// y el juego busca todas las palabras del diccionario que se pueden formar
// con sus letras. Así cada visita genera un tablero distinto.
const DICT = ["SOL","MAR","RIO","PAN","SAL","ASA","ORO","OSO","TIO","ROCA",
  "AMOR","MESA","ROSA","MORA","CAMA","CASA","LOBO","LUNA","NATA","NOTA","TOCA","MAPA","PALA","LAMA","COLA","ORCA","COTA","CARA","ALMA","LEMA","MANO","LANA","TORO","ROTO","TOMA","MAMA","PAPA","SACO","PATO","SALA","RATA","TELA","LATA","MATA","PESO",
  "MARES","CALOR","TOCAR","PERRO","GATO","LIBRO","LAPIZ","SILLA","NUBES","CORAL","MARCO","CARTA","PLATA","PLANO","CLAVO","SALTO","CAMPO","AMIGO","LLAMA",
  "PALOMA","PLANTA","CAMINO","ZAPATO","CAMISA","PUERTA","MARINO","TEATRO","GRANJA","VIAJAR",
  "PLANETA","PALABRA","CAMINOS","CORAZON","TORTUGA","MANZANA","BOTELLA","CABALLO","VENTANA","NARANJA","CARTERA","CAMELLO","RELOJES","LAMPARA","SOLDADO","ESCUELA"];

const LEVEL_KEY = "letraszen-nivel";
const BEST_KEY = "letraszen-records";
const LAST_KEY = "letraszen-ultima";

let levelLen = 6;
try { levelLen = +localStorage.getItem(LEVEL_KEY) || 6; } catch (e) {}
let best = {};
try { best = JSON.parse(localStorage.getItem(BEST_KEY) || "{}"); } catch (e) {}
let lastBase = null;
try { lastBase = localStorage.getItem(LAST_KEY); } catch (e) {}

const wordsEl = document.getElementById("words");
const wheelEl = document.getElementById("wheel");
const currentEl = document.getElementById("current");
const msgEl = document.getElementById("msg");
const zenBtn = document.getElementById("zen");
const hintBtn = document.getElementById("hint");
const infoEl = document.getElementById("info");

let state = null;
let sel = [];

const countOf = s => { const m = {}; for (const c of s) m[c] = (m[c] || 0) + 1; return m; };
const formable = (w, pool) => { const m = Object.assign({}, pool); for (const c of w) { if (!m[c]) return false; m[c]--; } return true; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

function flash(text) { msgEl.textContent = text; clearTimeout(flash.t); flash.t = setTimeout(() => msgEl.textContent = "", 1600); }

function newRound() {
  const bases = DICT.filter(w => w.length === levelLen && w !== lastBase);
  let base = null, words = [];
  for (let t = 0; t < 200; t++) {
    base = pick(bases);
    const pool = countOf(base);
    words = DICT.filter(w => w.length >= 3 && formable(w, pool));
    if (words.length >= 4) break;
  }
  lastBase = base;
  try { localStorage.setItem(LAST_KEY, base); } catch (e) {}
  words.sort((a, b) => a.length - b.length || (a < b ? -1 : 1));
  state = {
    base, words,
    letters: shuffle(base.split("")),
    found: [], revealed: {}, hints: 6, zen: false, score: 0
  };
  sel = [];
  render(true);
}

function renderHeader() {
  document.querySelectorAll("#levels .btn").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.l === levelLen)));
  const r = best[levelLen] || 0;
  infoEl.textContent = `${state.words.length} palabras · Puntos: ${state.score} · Récord: ${r}`;
}

function renderWords() {
  wordsEl.innerHTML = "";
  state.words.forEach(w => {
    const row = document.createElement("div");
    row.className = "row";
    const solved = state.found.includes(w);
    const rev = state.revealed[w] || [];
    for (let i = 0; i < w.length; i++) {
      const b = document.createElement("div");
      const show = solved || rev[i] || (state.zen && i === 0);
      b.className = "box" + (solved ? " solved" : "") + (show ? "" : " empty");
      b.textContent = show ? w[i] : "";
      row.appendChild(b);
    }
    wordsEl.appendChild(row);
  });
  zenBtn.setAttribute("aria-pressed", String(state.zen));
  hintBtn.textContent = `Pistas (${state.hints})`;
  hintBtn.disabled = state.hints === 0;
}

function renderWheel() {
  wheelEl.querySelectorAll(".letter").forEach(n => n.remove());
  const n = state.letters.length;
  state.letters.forEach((ch, pos) => {
    const a = (-Math.PI / 2) + (pos / n) * Math.PI * 2;
    const b = document.createElement("button");
    b.className = "letter";
    b.dataset.i = pos;
    b.textContent = ch;
    b.style.left = (50 + 40 * Math.cos(a)) + "%";
    b.style.top = (50 + 40 * Math.sin(a)) + "%";
    b.setAttribute("aria-label", ch);
    wheelEl.appendChild(b);
  });
}

function currentWord() { return sel.map(i => state.letters[i]).join(""); }

function paintSelection() {
  wheelEl.querySelectorAll(".letter").forEach(b => b.classList.toggle("on", sel.includes(+b.dataset.i)));
  currentEl.textContent = currentWord();
}

function submit() {
  const w = currentWord();
  sel = []; paintSelection();
  if (w.length < 3) return;
  if (state.found.includes(w)) return flash("Ya la tienes");
  if (state.words.includes(w)) {
    state.found.push(w);
    state.score += w.length;
    if (state.score > (best[levelLen] || 0)) { best[levelLen] = state.score; try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} }
    render();
    flash("¡Bien!");
    if (state.found.length === state.words.length) {
      document.getElementById("winText").textContent = `Has encontrado las ${state.words.length} palabras. Puntos: ${state.score}.`;
      document.getElementById("win").hidden = false;
    }
  } else {
    flash(w.length < 3 ? "Muy corta" : "Esa no está");
  }
}

function render(full) {
  renderHeader();
  renderWords();
  if (full) renderWheel();
  paintSelection();
}

// Arrastre con ratón o dedo. Volver sobre la letra anterior la deshace.
wheelEl.addEventListener("pointerdown", e => {
  const b = e.target.closest(".letter");
  if (!b) return;
  wheelEl.setPointerCapture(e.pointerId);
  sel = [+b.dataset.i]; paintSelection();
});
wheelEl.addEventListener("pointermove", e => {
  if (!sel.length) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const b = el && el.closest && el.closest(".letter");
  if (!b || !wheelEl.contains(b)) return;
  const i = +b.dataset.i;
  if (sel.length > 1 && i === sel[sel.length - 2]) sel.pop();
  else if (!sel.includes(i)) sel.push(i);
  paintSelection();
});
wheelEl.addEventListener("pointerup", () => { if (sel.length) submit(); });
wheelEl.addEventListener("pointercancel", () => { sel = []; paintSelection(); });

zenBtn.onclick = () => { state.zen = !state.zen; renderWords(); };

hintBtn.onclick = () => {
  if (state.hints === 0) return;
  const open = [];
  state.words.forEach(w => {
    if (state.found.includes(w)) return;
    const rev = state.revealed[w] || (state.revealed[w] = Array(w.length).fill(false));
    rev.forEach((r, i) => { if (!r) open.push([w, i]); });
  });
  if (!open.length) return;
  const [w, i] = pick(open);
  state.revealed[w][i] = true;
  state.hints--;
  renderWords();
};

document.getElementById("shuffle").onclick = () => { shuffle(state.letters); sel = []; renderWheel(); paintSelection(); };
document.getElementById("newround").onclick = newRound;
document.getElementById("again").onclick = () => { document.getElementById("win").hidden = true; newRound(); };
document.getElementById("close").onclick = () => document.getElementById("win").hidden = true;

document.querySelectorAll("#levels .btn").forEach(b => b.onclick = () => {
  levelLen = +b.dataset.l;
  try { localStorage.setItem(LEVEL_KEY, String(levelLen)); } catch (e) {}
  newRound();
});

newRound();
</script>

<script src="ayuda.js" data-juego="letras-zen"></script>
</body>
</html>
