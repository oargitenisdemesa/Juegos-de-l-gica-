<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos de lógica</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#22201c;--mute:#756f64;--line:#d9d2c3;--accent:#22201c}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--panel:#201e1b;--ink:#efebe2;--mute:#9a9486;--line:#38342d;--accent:#efebe2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:22px 16px 48px}
h1{font-size:2rem;margin:6px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.list{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:520px){.list{grid-template-columns:1fr 1fr}}
a.g{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px}
a.g:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{flex:none;width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
h2{font-size:1.08rem;margin:0}
.d{color:var(--mute);font-size:.88rem;margin:2px 0 0}
.w{font-size:.8rem;color:var(--mute);margin-top:4px}
.w b{color:var(--ink)}
h3{font-size:1.1rem;margin:28px 0 10px;color:var(--mute);font-weight:normal;letter-spacing:.02em}
footer{color:var(--mute);font-size:.85rem;margin-top:22px}
</style>
</head>
<body>
<main>
<h1>Juegos de lógica</h1>
<p class="sub">Elige un juego para ejercitar la mente. Todos tienen tres niveles y modo contrarreloj.</p>
<h3>Lógica y matemáticas</h3>
<div class="list" id="list-lm"></div>
<h3>Puzles</h3>
<div class="list" id="list"></div>
<footer>Las partidas ganadas se guardan en este navegador.</footer>
</main>
<script>
const G=[
  {f:"cuadrado-magico.html",k:"cuadrado-magico-lg",n:"Cuadrado mágico",d:"Rellena el 3×3 para que todas las sumas den 15.",i:"✨",c:"#f3e7fb",s:"lm"},
  {f:"caballeros-mentirosos.html",k:"caballeros-lg",n:"Caballeros y mentirosos",d:"Averigua quién dice la verdad a partir de sus frases.",i:"🤥",c:"#e3f0f5",s:"lm"},
  {f:"balanza.html",k:"balanza-lg",n:"Balanza",d:"Encuentra la moneda pesada con el mínimo de pesadas.",i:"⚖️",c:"#f7efd9",s:"lm"},
  {f:"calculo-contrarreloj.html",k:"calculo-lg",n:"Cálculo contrarreloj",d:"Diez operaciones mentales en 60 segundos.",i:"➗",c:"#e6f3e6",s:"lm"},
  {f:"fracciones-orden.html",k:"fracciones-lg",n:"Fracciones en orden",d:"Ordena las fracciones de menor a mayor.",i:"🍕",c:"#fbe6d8",s:"lm"},
  {f:"codigo-secreto.html",k:"codigo-secreto",n:"Código secreto",d:"Deduce la combinación de colores.",i:"🎯",c:"#fde2e4"},
  {f:"sudoku.html",k:"sudoku-lg",n:"Sudoku",d:"Rellena la cuadrícula del 1 al 9.",i:"🔢",c:"#e2ecfd"},
  {f:"apagar-luces.html",k:"apagar-luces",n:"Apagar luces",d:"Deja todas las luces apagadas.",i:"💡",c:"#fdf3c9"},
  {f:"torres-de-hanoi.html",k:"hanoi-lg",n:"Torres de Hanói",d:"Mueve los discos a la otra torre.",i:"🗼",c:"#e4f4e6"},
  {f:"parejas.html",k:"parejas-lg",n:"Parejas",d:"Encuentra los pares de cartas.",i:"🃏",c:"#ece2fb"},
  {f:"deslizante.html",k:"deslizante-lg",n:"Puzle deslizante",d:"Ordena las fichas deslizándolas.",i:"🧩",c:"#fde8d4"},
  {f:"buscaminas.html",k:"buscaminas-lg",n:"Buscaminas",d:"Despeja el campo sin pisar minas.",i:"💣",c:"#e3e6ea"},
  {f:"nonograma.html",k:"nonograma-lg",n:"Nonograma",d:"Descubre el dibujo con las pistas.",i:"🖼️",c:"#d9f1f1"},
  {f:"secuencias.html",k:"secuencias-lg",n:"Secuencias",d:"Averigua el número que sigue.",i:"📈",c:"#f9dfee"},
  {f:"inundacion.html",k:"inundacion-lg",n:"Inundación",d:"Llena el tablero de un solo color.",i:"🌊",c:"#dbe9fb"},
  {f:"cadena-de-palabras.html",k:"cadena-palabras-lg",n:"Cadena de palabras",d:"Encadena palabras con reglas que se suman.",i:"🔗",c:"#e6efd3"},
  {f:"dilema-del-orden.html",k:"dilema-orden-lg",n:"Dilema del orden",d:"Ordena 6 elementos adivinando la regla.",i:"🔀",c:"#fbe0dc"},
  {f:"numeros-que-hablan.html",k:"numeros-hablan-lg",n:"Números que hablan",d:"Descifra qué dígito esconde cada símbolo.",i:"🗝️",c:"#f1e6c8"},
  {f:"cadena-rota.html",k:"cadena-rota-lg",n:"Cadena rota",d:"Encuentra el número que rompe el patrón.",i:"🔍",c:"#dfe6f1"},
  {f:"letras-zen.html",k:"letras-zen",n:"Letras Zen",d:"Encuentra las palabras ocultas en la rueda.",i:"🔤",c:"#e4eee4"}
];
G.forEach(g=>{
  let w=0;
  try{const s=JSON.parse(localStorage.getItem(g.k)||"null");if(s&&s.w)w=s.w}catch(e){}
  const a=document.createElement("a");a.className="g";a.href=g.f;
  a.innerHTML='<div class="ic" style="background:'+g.c+'">'+g.i+'</div><div><h2>'+g.n+'</h2><p class="d">'+g.d+'</p><div class="w">Ganadas: <b>'+w+'</b></div></div>';
  document.getElementById(g.s==="lm"?"list-lm":"list").appendChild(a);
});
</script>
</body>
</html>
