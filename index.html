<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos de lógica</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#22201c;--mute:#756f64;--line:#d9d2c3;--accent:#22201c}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--panel:#201e1b;--ink:#efebe2;--mute:#9a9486;--line:#38342d;--accent:#efebe2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:22px 16px 48px}
h1{font-size:2rem;margin:6px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.list{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:520px){.list{grid-template-columns:1fr 1fr}}
a.g{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px}
a.g:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{flex:none;width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
h2{font-size:1.08rem;margin:0}
.d{color:var(--mute);font-size:.88rem;margin:2px 0 0}
.w{font-size:.8rem;color:var(--mute);margin-top:4px}
.w b{color:var(--ink)}
footer{color:var(--mute);font-size:.85rem;margin-top:22px}
</style>
</head>
<body>
<main>
<h1>Juegos de lógica</h1>
<p class="sub">Elige un juego para ejercitar la mente. Todos tienen tres niveles y modo contrarreloj.</p>
<div class="list" id="list"></div>
<footer>Las partidas ganadas se guardan en este navegador.</footer>
</main>
<script>
const G=[
  {f:"codigo-secreto.html",k:"codigo-secreto",n:"Código secreto",d:"Deduce la combinación de colores.",i:"🎯",c:"#fde2e4"},
  {f:"sudoku.html",k:"sudoku-lg",n:"Sudoku",d:"Rellena la cuadrícula del 1 al 9.",i:"🔢",c:"#e2ecfd"},
  {f:"apagar-luces.html",k:"apagar-luces",n:"Apagar luces",d:"Deja todas las luces apagadas.",i:"💡",c:"#fdf3c9"},
  {f:"torres-de-hanoi.html",k:"hanoi-lg",n:"Torres de Hanói",d:"Mueve los discos a la otra torre.",i:"🗼",c:"#e4f4e6"},
  {f:"parejas.html",k:"parejas-lg",n:"Parejas",d:"Encuentra los pares de cartas.",i:"🃏",c:"#ece2fb"}
];
const list=document.getElementById("list");
G.forEach(g=>{
  let w=0;
  try{const s=JSON.parse(localStorage.getItem(g.k)||"null");if(s&&s.w)w=s.w}catch(e){}
  const a=document.createElement("a");a.className="g";a.href=g.f;
  a.innerHTML='<div class="ic" style="background:'+g.c+'">'+g.i+'</div><div><h2>'+g.n+'</h2><p class="d">'+g.d+'</p><div class="w">Ganadas: <b>'+w+'</b></div></div>';
  list.appendChild(a);
});
</script>
</body>
</html>
