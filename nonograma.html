<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonograma</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#22201c;--mute:#756f64;--line:#d9d2c3;--accent:#22201c;--ok:#2e7d4f;--ko:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--panel:#201e1b;--ink:#efebe2;--mute:#9a9486;--line:#38342d;--accent:#efebe2;--ok:#6fcf97;--ko:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:560px;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.95rem}
.top a{color:inherit}
.top b{color:var(--ink)}
h1{font-size:1.7rem;margin:10px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);font:inherit;padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--bg)}
label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:var(--mute)}
#clock{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:bold}
.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed=true]{background:var(--accent);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
#msg{min-height:1.6em;margin-top:14px;font-weight:bold;text-align:center}
#msg.ok{color:var(--ok)}
#msg.ko{color:var(--ko)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
<style>
#board{display:grid;gap:2px;margin:0 auto;width:min(100%,460px);font-size:.9rem;touch-action:none;user-select:none;-webkit-user-select:none}
.pc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:clamp(.65rem,3vw,.9rem);line-height:1.15;padding-bottom:4px}
.pr{display:flex;justify-content:flex-end;align-items:center;gap:.4em;padding-right:6px;font-size:clamp(.65rem,3vw,.9rem)}
.done{opacity:.35}
.c{aspect-ratio:1;border:0;padding:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font:inherit;cursor:pointer;border-radius:3px}
.c.f{background:var(--ink)}
.c.m5{margin-right:4px}
</style>
</head>
<body>
<main>
<div class="top"><a href="index.html">← Juegos</a><span>Ganadas: <b id="wins">0</b></span></div>
<h1>Nonograma</h1>
<p class="sub">Los números dicen cuántas casillas seguidas van rellenas en cada fila y columna. Descubre el dibujo.</p>
<div class="ctl">
  <div class="seg" id="lv"><button aria-pressed="true">Fácil</button><button aria-pressed="false">Medio</button><button aria-pressed="false">Difícil</button></div>
  <label><input type="checkbox" id="ct"> Contrarreloj</label>
</div>
<div class="ctl">
  <button class="btn" id="mR" aria-pressed="true">■ Rellenar</button>
  <button class="btn" id="mM" aria-pressed="false">✕ Marcar vacía</button>
</div>
<div class="bar"><span id="info">Arrastra para pintar varias</span><span id="clock">0:00</span><button class="btn" id="nueva">Nueva partida</button></div>
<div id="board"></div>
<div id="msg" role="status"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
/* Marco común: niveles, contrarreloj, reloj y contador de partidas ganadas.
   cfg = { key, limites:[seg fácil, medio, difícil], nuevo(nivel, marco), alFin(ganado) } */
function Marco(cfg){
  const M={nivel:0,fin:false,t0:0,tick:0,limite:0};
  const clock=$("#clock"),msg=$("#msg"),ct=$("#ct"),botones=[...document.querySelectorAll("#lv button")];
  const leer=()=>{try{return JSON.parse(localStorage.getItem(cfg.key)||"null")||{w:0}}catch(e){return{w:0}}};
  const verGanadas=()=>{$("#wins").textContent=leer().w||0};
  M.seg=()=>M.t0?Math.floor((Date.now()-M.t0)/1000):0;
  M.dibujar=()=>{
    const e=M.seg();
    if(ct.checked){
      const r=Math.max(M.limite-e,0);
      clock.textContent="⏱ "+fmt(r);
      if(r===0&&M.t0&&!M.fin)M.perder("⏰ Se acabó el tiempo.");
    }else clock.textContent=fmt(e);
  };
  M.iniciarReloj=()=>{if(M.t0||M.fin)return;M.t0=Date.now();M.tick=setInterval(M.dibujar,250)};
  const cerrar=(ok,txt)=>{
    M.fin=true;clearInterval(M.tick);M.dibujar();
    msg.className=ok?"ok":"ko";msg.textContent=txt;
    if(cfg.alFin)cfg.alFin(ok);
  };
  M.ganar=t=>{
    if(M.fin)return;
    const s=leer();s.w=(s.w||0)+1;
    try{localStorage.setItem(cfg.key,JSON.stringify(s))}catch(e){}
    verGanadas();cerrar(true,"🎉 "+t);
  };
  M.perder=t=>{if(!M.fin)cerrar(false,t)};
  M.nueva=()=>{
    clearInterval(M.tick);M.t0=0;M.fin=false;M.limite=cfg.limites[M.nivel];
    msg.textContent="";msg.className="";M.dibujar();
    cfg.nuevo(M.nivel,M);
  };
  botones.forEach((b,i)=>b.onclick=()=>{
    M.nivel=i;botones.forEach((x,j)=>x.setAttribute("aria-pressed",i===j));M.nueva();
  });
  ct.onchange=M.nueva;
  $("#nueva").onclick=M.nueva;
  verGanadas();M.nueva();
  return M;
}
</script>
<script>
const S=[5,8,10];
let n,sol,cur,pf,pc,modo=1,val=0,arrastre=false,celdas=[],clF=[],clC=[];
const board=$("#board");

const pistas=l=>{
  const o=[];let k=0;
  l.forEach(v=>{if(v)k++;else if(k){o.push(k);k=0}});
  if(k)o.push(k);
  return o.length?o:[0];
};
const igual=(x,y)=>x.length===y.length&&x.every((v,i)=>v===y[i]);
const fila=(m,r)=>Array.from({length:n},(_,c)=>m[r*n+c]===1?1:0);
const col=(m,c)=>Array.from({length:n},(_,r)=>m[r*n+c]===1?1:0);

function nuevoTablero(){
  sol=Array.from({length:n*n},()=>Math.random()<.58?1:0);
  cur=Array(n*n).fill(0);
  pf=Array.from({length:n},(_,r)=>pistas(fila(sol,r)));
  pc=Array.from({length:n},(_,c)=>pistas(col(sol,c)));
  const k=Math.max(...pf.map(p=>p.length));
  let h='<div></div>';
  pc.forEach(p=>h+='<div class="pc">'+p.map(x=>"<span>"+x+"</span>").join("")+"</div>");
  for(let r=0;r<n;r++){
    h+='<div class="pr">'+pf[r].map(x=>"<span>"+x+"</span>").join("")+"</div>";
    for(let c=0;c<n;c++)h+='<button class="c" data-i="'+(r*n+c)+'" aria-label="Fila '+(r+1)+', columna '+(c+1)+'"></button>';
  }
  board.style.gridTemplateColumns=(k*1.3+.6)+"em repeat("+n+",1fr)";
  board.innerHTML=h;
  celdas=[...board.querySelectorAll(".c")];
  clF=[...board.querySelectorAll(".pr")];
  clC=[...board.querySelectorAll(".pc")];
}

function pintarCelda(i){
  const e=celdas[i];
  e.className="c"+(cur[i]===1?" f":"");
  e.textContent=cur[i]===2?"✕":"";
}

function comprobar(){
  let todo=true;
  for(let r=0;r<n;r++){
    const ok=igual(pistas(fila(cur,r)),pf[r]);
    clF[r].classList.toggle("done",ok);if(!ok)todo=false;
  }
  for(let c=0;c<n;c++){
    const ok=igual(pistas(col(cur,c)),pc[c]);
    clC[c].classList.toggle("done",ok);if(!ok)todo=false;
  }
  if(todo)M.ganar("¡Nonograma resuelto!");
}

const M=Marco({
  key:"nonograma-lg",
  limites:[180,480,900],
  nuevo(l){n=S[l];nuevoTablero()}
});

function aplicar(i){
  if(cur[i]===val)return;
  cur[i]=val;pintarCelda(i);
}
board.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".c");
  if(!c||M.fin)return;
  e.preventDefault();
  M.iniciarReloj();
  const t=e.button===2?2:modo,i=+c.dataset.i;
  val=cur[i]===t?0:t;
  arrastre=true;aplicar(i);
});
board.addEventListener("pointermove",e=>{
  if(!arrastre||M.fin)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest(".c");
  if(c&&board.contains(c))aplicar(+c.dataset.i);
});
addEventListener("pointerup",()=>{if(arrastre){arrastre=false;if(!M.fin)comprobar()}});
addEventListener("pointercancel",()=>{arrastre=false});
board.addEventListener("contextmenu",e=>e.preventDefault());

const mR=$("#mR"),mM=$("#mM");
mR.onclick=()=>{modo=1;mR.setAttribute("aria-pressed",true);mM.setAttribute("aria-pressed",false)};
mM.onclick=()=>{modo=2;mM.setAttribute("aria-pressed",true);mR.setAttribute("aria-pressed",false)};
</script>
<script src="ayuda.js" data-juego="nonograma"></script>
</body>
</html>
